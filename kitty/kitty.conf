# ---------------------------------------------------------
# WINDOW
# ---------------------------------------------------------

background_opacity 1
dynamic_background_opacity no

tab_bar_edge top
tab_bar_style powerline
tab_powerline_style slanted
tab_bar_min_tabs 2
tab_bar_margin_width 2
active_tab_font_style bold
active_tab_foreground #000000
active_tab_background #B9D86B
inactive_tab_foreground #8992A1
inactive_tab_background #10141C
tab_title_template {title}

window_padding_width 10

confirm_os_window_close 0
remember_window_size yes

# Slightly softer visual density
inactive_text_alpha 0.89

# ---------------------------------------------------------
# TYPOGRAPHY
# ---------------------------------------------------------

font_family JetBrainsMono Nerd Font
bold_font auto
italic_font auto
bold_italic_font auto

font_size 13

# ---------------------------------------------------------
# CURSOR
# ---------------------------------------------------------

cursor_shape block

cursor #B9D86B
cursor_text_color #080A0F

cursor_blink_interval 0.6
cursor_stop_blinking_after 15
cursor_trail 1
cursor_trail_decay 0.1 0.4

# ---------------------------------------------------------
# BASE COLORS
# ---------------------------------------------------------

background #000000
foreground #F1F3ED

selection_background #28351E
selection_foreground #F1F3ED

# ---------------------------------------------------------
# LUMEN GRID ANSI PALETTE
# ---------------------------------------------------------

# Normal

color0  #10141C
color1  #EF7180
color2  #7CC7D9
color3  #B9D86B
color4  #8496D5
color5  #B58BD4
color6  #6FC5B7
color7  #C6CBD2

# Bright

color8  #4B5564
color9  #F28C98
color10 #9ADCEB
color11 #D2EE8B
color12 #A6B6ED
color13 #CEA8E8
color14 #91E0D1
color15 #F1F3ED

# include ~/.config/matugen/colors/kitty-colors.conf
