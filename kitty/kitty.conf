# ─────────────────────────────────────────────────────────────
# MINFLAIR x BAT-FUN UNIFIED KITTY CONFIG
# ─────────────────────────────────────────────────────────────

include theme.conf

# --- Typography ---
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.0

# --- Window & Appearance ---
window_padding_width 16
confirm_os_window_close 0
remember_window_size yes

background_opacity 0.92
dynamic_background_opacity yes
inactive_text_alpha 0.90

# --- Cursor (Modern Trail) ---
cursor_shape block
cursor_trail 2
cursor_trail_decay 0.1 0.4
cursor_blink_interval 0.6
cursor_stop_blinking_after 15

# --- Tab Bar ---
tab_bar_edge top
tab_bar_style powerline
tab_powerline_style slanted
tab_bar_min_tabs 2
tab_bar_margin_width 4
active_tab_font_style bold
tab_title_template " {title} "

# --- Layouts & Splits (Minflair binds) ---
enabled_layouts splits:split_axis=auto

map ctrl+shift+enter new_window_with_cwd

map alt+shift+left  neighboring_window left
map alt+shift+right neighboring_window right
map alt+shift+up    neighboring_window top
map alt+shift+down  neighboring_window bottom
