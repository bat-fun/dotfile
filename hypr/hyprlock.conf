$font = JetBrainsMono Nerd Font

general {
    hide_cursor = true
    ignore_empty_input = true
    immediate_render = true
    fail_timeout = 1800
}

# Background
background {
    monitor =
    path = screenshot

    blur_passes = 2
    blur_size = 4
    noise = 0.1
    contrast = 0.95
    brightness = 0.6
    vibrancy = 0.4
}

# Clock - 12 hour
label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%I:%M %p')"

    color = rgb(EEEEEE)
    font_family = $font
    font_size = 60

    position = 0, 100
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%A, %B %d')"

    color = rgb(888888)
    font_family = $font
    font_size = 15

    position = 0, 45
    halign = center
    valign = center
}

# Password field
input-field {
    monitor =

    size = 270, 42
    rounding = 12
    outline_thickness = 1

    outer_color = rgb(444444)
    inner_color = rgb(151515)
    font_color = rgb(EEEEEE)

    dots_size = 0.22
    dots_spacing = 0.4
    dots_center = true
    dots_rounding = -1

    fade_on_empty = false
    placeholder_text =
    hide_input = false

    check_color = rgb(AAAAAA)
    fail_color = rgb(FF5555)
    fail_text = <b>$FAIL</b>
    capslock_color = rgb(FFAA33)

    position = 0, -100
    halign = center
    valign = center
}