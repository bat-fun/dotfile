format = """
$username$directory $git_branch$git_status
$character
"""

command_timeout = 5001
add_newline = false
palette = "matugen"

[username]
style_user = "fg:bg bold bg:accent bold"
style_root = "bg bold"
format = "[](bold fg:accent)[$user]($style)[ ](bold fg:accent)"
disabled = false
show_always = true

[directory]
style = "bg:accent fg:bg bold"
format = '󰜥 [](bold fg:accent)[󰉋 $path]($style)[](bold fg:accent)'

[character]
success_symbol = "[](bold fg:accent)"
error_symbol = "[](bold fg:error)"

[git_branch]
style = "bg:accent fg:bg bold"
symbol = "󰘬"
truncation_length = 13
truncation_symbol = ""
format = "[](bold fg:accent)[$symbol $branch(:$remote_branch)]($style)[ ](bold fg:accent)"

[git_status]
style = "fg:accent"
format = '([$all_status$ahead_behind]($style))'

[palettes.matugen]
bg = "#09080c"
fg = "{{colors.on_background.dark.hex}}"
accent = "{{colors.primary.dark.hex}}"
accentComplementary = "{{colors.secondary.dark.hex}}"
error = "{{colors.error.dark.hex}}"
